[project]
name = "adobe-ai-engineer-round-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-community>=0.3",
    "pymupdf>=1.25",
    "python-dotenv>=1.0",
    "ipykernel>=6.29",
    "pymupdf4llm>=0.2.9",
    "edgartools>=5.15.2",
    "ipywidgets>=8.1.8",
    "html2text>=2025.4.15",
    "tiktoken>=0.12.0",
    "langchain-text-splitters>=1.1.0",
    "langchain-core>=1.2.11",
    "litellm>=1.81.10",
    "weaviate-client>=4.19.2",
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chunker", "src/utils", "src/vectorstore", "src/tools", "src/agent"]
